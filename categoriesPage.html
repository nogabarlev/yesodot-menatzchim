<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ראשי פרקים</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body class="categories-page">

    <div class="phone">

        <div class="screen">

            <section class="categories-hero">

                <div class="hero-curve hero-curve-top"></div>

                <div class="hero-content">

                    <div class="categories-card">

                            ראשי<br>

                        </p>

                        <div class="chapters-list">

                            <!-- פרק 1 -->
                            <div class="chapter-card">
                                <div class="chapter-number">1</div>

                                <div class="chapter-text">
                                    <span>פרק 1</span>

                                </div>

                                <div class="chapter-arrow">
                                    ‹
                                </div>

                                <div class="chapter-number">2</div>

                                <div class="chapter-text">
                                    <span>פרק 2</span>

                                </div>

                                <div class="chapter-arrow">
                                    ‹
                                </div>
                            </div>

                            <!-- פרק 3 -->

                                <div class="chapter-number">3</div>

                                <div class="chapter-text">
                                    <span>פרק 3</span>
                                    <strong>סגל הכשרה</strong>
                                </div>

                                <div class="chapter-arrow">
                                    ‹
                                </div>
                            </div>

                            <!-- פרק 4 -->
                            <div class="chapter-card">
                                <div class="chapter-number">4</div>

                                <div class="chapter-text">
                                    <span>פרק 4</span>
                                    <strong>חניכים בהכשרה</strong>
                                </div>

                                <div class="chapter-arrow">
                                    ‹
                                </div>
                            </div>

                            <div class="chapter-card">
                                <div class="chapter-number">5</div>

                                <div class="chapter-text">
                                    <span>פרק 5</span>
                                    <strong>סביבת הכשרה</strong>
                                </div>

                                <div class="chapter-arrow">
                                    ‹
                                </div>

                    </div>

                </div>

            </section>

        </div>

    <div class="footer-credit">
        פותח ע״י סמל נוגה בר-לב
