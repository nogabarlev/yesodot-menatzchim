<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>ראשי פרקים</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="phone">

    <div class="screen scroll-screen">

        <!-- HERO -->

        <section class="categories-hero">

            <div class="hero-overlay"></div>

            <!-- logo -->
            <img src="media/logo.png" class="logo">

            <!-- icons -->
            <div class="top-icons">

                <img src="media/icons/settingsIcon.svg">

                <img src="media/icons/categoriesIcon.svg">

            </div>

            <!-- content -->
            <div class="hero-content">

                <p class="small-title">
                    אפליקציית תל״ב בכף היד
                </p>

                <h1 class="main-title">
                    ראשי<br>
                    פרקים
                </h1>

                <div class="scroll-indicator">

                    <p>גללו מטה</p>

                    <img src="media/icons/swipeUpIcon.svg">

                </div>

            </div>

        </section>

        <!-- CHAPTERS -->

        <div class="scroll-content">

            <section class="chapters-section">

                <!-- CARD -->

                <div class="chapter-card">

                    <img src="media/strugglingCamperPic.jpg">

                    <div class="chapter-info">

                        <h3>
                            טיפול בחניך מתקשה
                        </h3>

                        <div class="progress-bar">

                            <div class="progress-fill fill1"></div>

                        </div>

                        <p>70% הושלם</p>

                    </div>

                </div>

                <!-- CARD -->

                <div class="chapter-card">

                    <img src="media/committeePic.jpg">

                    <div class="chapter-info">

                        <h3>
                            ועדה להערכת חניך
                        </h3>

                        <div class="progress-bar">

                            <div class="progress-fill fill2"></div>

                        </div>

                        <p>45% הושלם</p>

                    </div>

                </div>

                <!-- CARD -->

                <div class="chapter-card">

                    <img src="media/excellentCamperPic.jpg">

                    <div class="chapter-info">

                        <h3>
                            בחירת חניך מצטיין
                        </h3>

                        <div class="progress-bar">

                            <div class="progress-fill fill3"></div>

                        </div>

                        <p>90% הושלם</p>

                    </div>

                </div>

                <!-- CARD -->

                <div class="chapter-card">

                    <img src="media/personalBagPic.jpg">

                    <div class="chapter-info">

                        <h3>
                            תיק אישי לחניך
                        </h3>

                        <div class="progress-bar">

                            <div class="progress-fill fill4"></div>

                        </div>

                        <p>30% הושלם</p>

                    </div>

                </div>

            </section>

        </div>

    </div>

</div>

</body>

</html>
