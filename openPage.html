<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>יסודות מנצחים</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="phone">

        <div class="screen scroll-screen">

            <!-- HERO -->
            <section class="hero-section">

                <!-- overlay -->
                <div class="hero-overlay"></div>

                <!-- top -->
                <img src="media/logo.png" class="logo">

                <div class="top-icons">

                    <img src="media/icons/settingsIcon.svg">

                    <img src="media/icons/categoriesIcon.svg">

                </div>

                <!-- content -->
                <div class="hero-content">

                    <p class="small-title">
                        אפליקציית תל״ב בכף היד
                    </p>

                    <h1 class="main-title">
                        יסודות<br>
                        מנצחים
                    </h1>

                    <div class="scroll-indicator">

                        <p>גללו מטה</p>

                        <img src="media/icons/swipeUpIcon.svg">

                    </div>

                </div>

            </section>

            <!-- CONTENT -->
            <div class="scroll-content">

                <section class="progress-section">

                    <div class="progress-card">

                        <p class="hello-text"
                        id="helloText">
                        </p>

                        <h2>
                            קצב ההתקדמות שלך בחומר
                        </h2>

                        <!-- progress -->
                        <div class="progress-ring" id="progressRing">

                            <div class="progress-inner">

                                <span id="totalProgress">
                                    0%
                                </span>

                            </div>

                        </div>

                        <p
                        class="progress-description"
                        id="progressDescription">
                        </p>

                        <button id="continueBtn">
                            המשך למידה
                        </button>

                    </div>

                </section>

            </div>

        </div>

    </div>
    <div class="footer-credit">
        פותח ע״י רב״ט נוגה בר-לב
    </div>

    <script type="module" src="code.js"></script>
    

</body>

</html>
