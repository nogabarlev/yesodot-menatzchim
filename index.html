<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>יסודות מנצחים</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="phone">

        <div class="screen">

            <!-- ========================= -->
            <!-- HOME / HERO -->
            <!-- ========================= -->

            <section class="hero-section">

                <div class="hero-overlay"></div>


                <!-- TEAM PLA LOGO -->

                <img
                    src="media/logo.png"
                    class="logo"
                    alt="צוות פל״א"
                >


                <!-- DECORATIVE CURVES -->

                <div class="hero-curve hero-curve-top"></div>

                <div class="hero-curve hero-curve-bottom"></div>


                <!-- MAIN CONTENT -->

                <div class="hero-content">

                    <div class="welcome-card">


                        <!-- CARD DECORATION -->

                        <div class="card-curve card-curve-top"></div>

                        <div class="card-curve card-curve-bottom"></div>


                        <!-- SMALL TITLE -->

                        <p class="small-title">
                            אפליקציית תל״ב בכף היד
                        </p>


                        <!-- MAIN TITLE -->

                        <h1 class="main-title">

                            יסודות<br>

                            מנצחים

                        </h1>


                        <!-- DIVIDER -->

                        <div class="title-divider"></div>


                        <!-- COMMAND -->

                        <p class="command-title">
                            פיקוד ההכשרות והאימונים
                        </p>


                        <!-- BRIGADE -->

                        <h2 class="brigade-title">
                            חטיבת האש שבטה
                        </h2>


                        <!-- START BUTTON -->
                         
                        
                        <div
                        class="start-learning"
                        id="continueBtn"
                        onclick="window.location.href='categoriesPage.html'"
                        >

                            <span>
                                התחלת למידה
                            </span>

                            <div class="start-icon">

                                <img
                                    src="media/icons/swipeUpIcon.svg"
                                    alt=""
                                >

                            </div>

                        </div>


                    </div>

                </div>

            </section>

        </div>

    </div>


    <!-- FOOTER -->

    <div class="footer-credit">

        פותח ע״י סמל נוגה בר-לב

    </div>


    <script type="module" src="code.js"></script>

</body>

</html>
