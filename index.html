<!DOCTYPE html>
    <title>יסודות מנצחים</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="phone">

    <div class="screen scroll-screen">

        <!-- HERO SECTION -->
        <section class="hero-section">

            <img src="media/logo.png" class="logo">

            <div class="top-icons">
                <img src="media/icons/settingsIcon.svg">
                <img src="media/icons/categoriesIcon.svg">
            </div>

            <div class="hero-overlay"></div>

            <div class="hero-content">

                <p class="small-title">אפליקציית תל״ב בכף היד</p>

                <h1 class="main-title">יסודות מנצחים</h1>

                <img src="media/openPagePic.jpg" class="hero-image">

                <div class="scroll-indicator">
                    <p>גללו למטה</p>
                    <img src="media/icons/swipeUpIcon.svg">
                </div>

            </div>

        </section>


        <!-- PROGRESS SECTION -->
        <section class="progress-section">

            <div class="progress-card">

                <p class="hello-text">👋 שלום סמל א׳</p>

                <h2>קצב ההתקדמות שלך בחומר</h2>

                <div class="progress-ring">
                    <div class="progress-inner">
                        <span>60%</span>
                    </div>
                </div>

                <p class="progress-description">
                    כל הכבוד! המשך כך
                </p>

                <button id="continueBtn">
                    המשך למידה
                </button>

            </div>

        </section>

    </div>

</div>

<script src="code.js"></script>

</body>
</html>
