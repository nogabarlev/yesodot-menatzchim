<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>יסודות מנצחים</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="phone">

        <div class="screen scroll-screen">

            <!-- HERO -->

            <section class="hero-section">

                <!-- overlay -->
                <div class="hero-overlay"></div>

                <!-- top -->
                <img src="media/logo.png" class="logo">

                <img
                    id="gappaLogo"
                    src="media/icons/gappaLogo.png">

                <!-- content -->
                <div class="hero-content">

                    <p class="small-title">
                        אפליקציית תל״ב בכף היד
                    </p>

                    <h1 class="main-title">
                        יסודות<br>
                        מנצחים
                    </h1>
                    
                    
                    <h2 class="brigade-title">
                         חטיבת האש שבטה
                    </h2>


                    <div class="scroll-indicator">

                        <p>גללו מטה</p>

                        <img
                            id="continueBtn"
                            src="media/icons/swipeUpIcon.svg">

                    </div>

                </div>

            </section>

        </div>

    </div>

    <div class="footer-credit">
        פותח ע״י סמל נוגה בר-לב
    </div>

    <script src="code.js"></script>

</body>

</html>
